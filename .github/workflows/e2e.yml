name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

      - name: Provision cluster
        id: provision_cluster
        uses: agynio/e2e/.github/actions/provision-vm@main

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Disable ArgoCD auto-sync
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get application chat-app -n argocd >/dev/null 2>&1; then
            kubectl patch application chat-app -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}'
          else
            echo "WARNING: ArgoCD Application 'chat-app' not found."
          fi

      - name: Allow devspace sync into nginx html
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment chat-app -n agyn-platform
          kubectl patch deployment chat-app -n agyn-platform --type strategic \
            -p "$(cat <<'EOF_PATCH'
          {
            "spec": {
              "template": {
                "spec": {
                  "volumes": [
                    {
                      "name": "chat-app-html",
                      "emptyDir": {}
                    }
                  ],
                  "containers": [
                    {
                      "name": "chat-app",
                      "readinessProbe": {
                        "httpGet": {
                          "path": "/healthz",
                          "port": "http"
                        }
                      },
                      "volumeMounts": [
                        {
                          "name": "chat-app-html",
                          "mountPath": "/usr/share/nginx/html"
                        }
                      ]
                    }
                  ]
                }
              }
            }
          }
          EOF_PATCH
          )"
          kubectl rollout status deployment/chat-app -n agyn-platform --timeout=5m

      - name: Deploy from source
        run: devspace dev --pipeline dev

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        with:
          service: chat_app
          include_smoke: 'false'

      - name: Restore ArgoCD auto-sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get application chat-app -n argocd >/dev/null 2>&1; then
            kubectl patch application chat-app -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
          else
            echo "WARNING: ArgoCD Application 'chat-app' not found."
          fi
