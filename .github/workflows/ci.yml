name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      BOOTSTRAP_PROVISION_REF: c4f7f7bf7954e0eab929b30eded0c409b0997f21
      AGYN_AGENT_INIT_IMAGE: ghcr.io/agynio/agent-init:v1.0.0
      TF_VAR_threads_chart_version: 0.4.12
      TF_VAR_threads_image_tag: 0.4.12
      AGN_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:0.4.16
      CODEX_INIT_IMAGE: ghcr.io/agynio/agent-init-codex:0.13.20
      CLAUDE_INIT_IMAGE: ghcr.io/agynio/agent-init-claude:0.1.23
      AGN_EXPOSE_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:0.4.16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision cluster
        id: provision_cluster
        continue-on-error: true
        uses: agynio/bootstrap/.github/actions/provision@c4f7f7bf7954e0eab929b30eded0c409b0997f21
        with:
          ref: ${{ env.BOOTSTRAP_PROVISION_REF }}

      - name: Cleanup failed bootstrap cluster
        if: steps.provision_cluster.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if command -v k3d >/dev/null 2>&1; then
            k3d cluster delete agyn-local || true
          fi
          rm -rf bootstrap

      - name: Retry provision cluster
        if: steps.provision_cluster.outcome == 'failure'
        uses: agynio/bootstrap/.github/actions/provision@c4f7f7bf7954e0eab929b30eded0c409b0997f21
        with:
          ref: ${{ env.BOOTSTRAP_PROVISION_REF }}

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Disable ArgoCD auto-sync
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get application chat-app -n argocd >/dev/null 2>&1; then
            kubectl patch application chat-app -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}'
          else
            echo "WARNING: ArgoCD Application 'chat-app' not found."
          fi

      - name: Allow devspace sync into nginx html
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment chat-app -n platform
          kubectl patch deployment chat-app -n platform --type strategic \
            -p "$(cat <<'EOF'
          {
            "spec": {
              "template": {
                "spec": {
                  "volumes": [
                    {
                      "name": "chat-app-html",
                      "emptyDir": {}
                    }
                  ],
                  "containers": [
                    {
                      "name": "chat-app",
                      "readinessProbe": {
                        "httpGet": {
                          "path": "/healthz",
                          "port": "http"
                        }
                      },
                      "volumeMounts": [
                        {
                          "name": "chat-app-html",
                          "mountPath": "/usr/share/nginx/html"
                        }
                      ]
                    }
                  ]
                }
              }
            }
          }
          EOF
          )"
          kubectl rollout status deployment/chat-app -n platform --timeout=5m

      - name: Deploy from source
        run: devspace dev --pipeline dev

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@a8abde620dbfd9b9ed499aa59847928f2c81e1e0
        env:
          E2E_SUITES: playwright-chat-app
        with:
          tag: svc_files,svc_media_proxy
          include_smoke: 'false'
          ref: cadd8cfff6dd6648147eb401589614ae6b7b583d

      - name: Restore ArgoCD auto-sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get application chat-app -n argocd >/dev/null 2>&1; then
            kubectl patch application chat-app -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
          else
            echo "WARNING: ArgoCD Application 'chat-app' not found."
          fi
