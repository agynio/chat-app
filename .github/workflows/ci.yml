name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      AGYN_AGENT_INIT_IMAGE: ghcr.io/agynio/agent-init:v1.0.0
      TF_VAR_gateway_image_tag: sha-f3d99ba
      TF_VAR_threads_chart_version: 0.4.12
      TF_VAR_threads_image_tag: 0.4.12
      AGN_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:0.4.16
      CODEX_INIT_IMAGE: ghcr.io/agynio/agent-init-codex:0.13.20
      CLAUDE_INIT_IMAGE: ghcr.io/agynio/agent-init-claude:0.1.23
      AGN_EXPOSE_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:0.4.16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

      - name: Provision cluster
        id: provision_cluster
        continue-on-error: true
        uses: agynio/bootstrap/.github/actions/provision@main
        with:
          ref: main

      - name: Cleanup failed bootstrap cluster
        if: steps.provision_cluster.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if command -v k3d >/dev/null 2>&1; then
            k3d cluster delete agyn-local || true
          fi
          rm -rf bootstrap

      - name: Retry provision cluster
        if: steps.provision_cluster.outcome == 'failure'
        uses: agynio/bootstrap/.github/actions/provision@main
        with:
          ref: main

      - name: Verify bootstrap authorization model
        shell: bash
        run: |
          set -euo pipefail

          echo "bootstrap HEAD: $(git -C bootstrap rev-parse HEAD)"
          echo "bootstrap origin/main: $(git -C bootstrap rev-parse origin/main)"
          git -C bootstrap --no-pager log -1 --oneline

          grep -n 'authorization//terraform?ref=' bootstrap/stacks/platform/main.tf
          grep -n 'authorization_chart_version' bootstrap/stacks/platform/variables.tf
          grep -n 'default     = "0.5.3"' bootstrap/stacks/platform/variables.tf

          rm -rf bootstrap/stacks/platform/.terraform/modules/openfga_authorization
          terraform -chdir=bootstrap/stacks/platform init -upgrade
          terraform -chdir=bootstrap/stacks/platform apply -auto-approve

          domain=$(terraform -chdir=bootstrap/stacks/k8s output -raw domain)
          ingress_port=$(terraform -chdir=bootstrap/stacks/k8s output -raw ingress_port)
          store_id=$(terraform -chdir=bootstrap/stacks/platform output -raw openfga_store_id)
          model_id=$(terraform -chdir=bootstrap/stacks/platform output -raw openfga_model_id)
          echo "openfga store id: ${store_id}"
          echo "openfga model id: ${model_id}"

          model_json=$(mktemp)
          curl -fsS -k \
            "https://openfga.${domain}:${ingress_port}/stores/${store_id}/authorization-models/${model_id}" \
            -o "$model_json"
          node - "$model_json" <<'NODE'
          const fs = require('node:fs');

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const model = payload.authorization_model ?? payload;
          const definitions = model.type_definitions ?? [];
          const typeNames = definitions
            .map((definition) => definition.type)
            .filter((typeName) => typeof typeName === 'string' && typeName.length > 0)
            .sort();

          console.log(`openfga model types: ${typeNames.join(', ')}`);
          if (!typeNames.includes('agent')) {
            throw new Error('OpenFGA authorization model is missing required type: agent');
          }
          NODE

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Disable ArgoCD auto-sync
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get application chat-app -n argocd >/dev/null 2>&1; then
            kubectl patch application chat-app -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}'
          else
            echo "WARNING: ArgoCD Application 'chat-app' not found."
          fi

      - name: Allow devspace sync into nginx html
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment chat-app -n platform
          kubectl patch deployment chat-app -n platform --type strategic \
            -p "$(cat <<'EOF'
          {
            "spec": {
              "template": {
                "spec": {
                  "volumes": [
                    {
                      "name": "chat-app-html",
                      "emptyDir": {}
                    }
                  ],
                  "containers": [
                    {
                      "name": "chat-app",
                      "readinessProbe": {
                        "httpGet": {
                          "path": "/healthz",
                          "port": "http"
                        }
                      },
                      "volumeMounts": [
                        {
                          "name": "chat-app-html",
                          "mountPath": "/usr/share/nginx/html"
                        }
                      ]
                    }
                  ]
                }
              }
            }
          }
          EOF
          )"
          kubectl rollout status deployment/chat-app -n platform --timeout=5m

      - name: Deploy from source
        run: devspace dev --pipeline dev

      - name: Export chat app E2E endpoint
        shell: bash
        run: |
          set -euo pipefail
          domain=$(terraform -chdir=bootstrap/stacks/k8s output -raw domain)
          if [ -z "$domain" ]; then
            echo "Bootstrap output missing domain." >&2
            exit 1
          fi
          echo "E2E_DOMAIN=${domain}" >> "$GITHUB_ENV"
          echo "E2E_BASE_URL=https://chat.${domain}" >> "$GITHUB_ENV"

      - name: Validate E2E URLs
        shell: bash
        run: |
          set -euo pipefail
          ingress_external_ip=$(kubectl get service istio-ingressgateway -n istio-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          ingress_https_port=$(kubectl get service istio-ingressgateway -n istio-gateway -o jsonpath='{.spec.ports[?(@.port==443)].port}')
          if [ -z "$ingress_external_ip" ] || [ -z "$ingress_https_port" ]; then
            echo "Unable to resolve istio ingress external IP or HTTPS service port." >&2
            kubectl get service istio-ingressgateway -n istio-gateway -o wide || true
            exit 1
          fi
          host_e2e_base_url="https://${ingress_external_ip}:${ingress_https_port}"

          echo "Runner ingress URL: ${host_e2e_base_url}"
          echo "In-cluster app URL: ${E2E_BASE_URL}"
          echo "E2E domain: ${E2E_DOMAIN}"
          kubectl get service istio-ingressgateway -n istio-gateway -o wide

          for attempt in {1..30}; do
            status=$(curl -sS -k -H "Host: chat.${E2E_DOMAIN}" -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "${host_e2e_base_url}/healthz" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Waiting for ${host_e2e_base_url}/healthz via Host: chat.${E2E_DOMAIN} (attempt ${attempt}/30, status ${status})"
            sleep 5
          done
          if [ "${status}" != "200" ]; then
            echo "Chat ingress did not become ready at ${host_e2e_base_url}/healthz" >&2
            kubectl get virtualservice -A || true
            kubectl get gateway -A || true
            kubectl get svc,pods -n istio-gateway -o wide || true
            kubectl get svc,pods -n platform -l app.kubernetes.io/name=chat-app -o wide || true
            exit 1
          fi

          curl -v -k -H "Host: chat.${E2E_DOMAIN}" --connect-timeout 5 --max-time 10 "${host_e2e_base_url}/healthz"
          openssl s_client -connect "${ingress_external_ip}:${ingress_https_port}" -servername "chat.${E2E_DOMAIN}" -brief </dev/null
          kubectl run e2e-url-check -n platform --rm -i --restart=Never --image=curlimages/curl:8.11.1 \
            --env="E2E_BASE_URL=${E2E_BASE_URL}" \
            -- \
            sh -c 'set -eu; curl -v -k --connect-timeout 5 --max-time 10 "$E2E_BASE_URL/healthz"; curl -v -k --connect-timeout 5 --max-time 10 "$E2E_BASE_URL/"'

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@a8abde620dbfd9b9ed499aa59847928f2c81e1e0
        env:
          E2E_SUITES: playwright-chat-app
        with:
          service: chat_app
          include_smoke: 'false'
          ref: cd9cc165a7012f4283f367163b60c9ab62f14f42

      - name: Restore ArgoCD auto-sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get application chat-app -n argocd >/dev/null 2>&1; then
            kubectl patch application chat-app -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
          else
            echo "WARNING: ArgoCD Application 'chat-app' not found."
          fi
